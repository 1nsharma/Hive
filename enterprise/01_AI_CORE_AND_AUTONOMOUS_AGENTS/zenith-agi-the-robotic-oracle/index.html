
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenith AGI - Neural Core</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #020617;
      color: #f8fafc;
      font-family: 'Roboto Mono', monospace;
      overflow: hidden;
    }
    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }
    .glass-panel {
      background: rgba(8, 14, 28, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }
    .neon-text {
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.8), 0 0 20px rgba(56, 189, 248, 0.3);
    }
    
    /* CRT Scanline Effect */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 100;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }

    @keyframes flicker {
      0% { opacity: 0.97; }
      5% { opacity: 0.95; }
      10% { opacity: 0.9; }
      15% { opacity: 0.95; }
      20% { opacity: 0.98; }
      25% { opacity: 0.95; }
      30% { opacity: 0.9; }
      35% { opacity: 0.98; }
      40% { opacity: 0.95; }
      45% { opacity: 0.97; }
      50% { opacity: 0.92; }
      55% { opacity: 0.95; }
      60% { opacity: 0.98; }
      65% { opacity: 0.95; }
      70% { opacity: 0.9; }
      75% { opacity: 0.95; }
      80% { opacity: 0.98; }
      85% { opacity: 0.95; }
      90% { opacity: 0.9; }
      95% { opacity: 0.98; }
      100% { opacity: 0.97; }
    }

    .flicker-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: transparent;
      pointer-events: none;
      z-index: 101;
      animation: flicker 0.15s infinite;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #080c14; }
    ::-webkit-scrollbar-thumb { background: #0ea5e9; border-radius: 2px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
      "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
      "react/": "https://esm.sh/react@^19.2.3/",
      "react": "https://esm.sh/react@^19.2.3",
      "d3": "https://esm.sh/d3@^7.9.0"
    }
  }
  </script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div class="flicker-overlay"></div>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
