name: Code Quality & Auto-Fix Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  auto-fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check & Verification
        run: npm run type-check

      - name: Verify Build Output
        run: npm run build
