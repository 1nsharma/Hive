<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetJanu — India's Most Trusted Pet Safety &amp; Care Platform (petsjanu.com)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5.0.20/600.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5.0.20/700.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5.0.20/900.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5.0.20/italic-600.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-sans@5.0.20/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-sans@5.0.20/500.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-sans@5.0.20/600.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-sans@5.0.20/700.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-mono@5.0.20/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-mono@5.0.20/700.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "PetJanu",
          "url": "https://petsjanu.com",
          "operatingSystem": "ANDROID, IOS, WEB",
          "applicationCategory": "LifestyleApplication",
          "description": "India's most trusted public pet safety platform with QR/NFC smart tags, lost pet SOS alerts, 24/7 AI health guidance, pet product store, and vet bookings.",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
          "aggregateRating": { "@type": "AggregateRating", "ratingValue": "4.8", "ratingCount": "10420" },
          "publisher": { "@type": "Organization", "name": "PetJanu", "logo": "https://petsjanu.com/logo.png" }
        },
        {
          "@type": "Organization",
          "name": "PetJanu",
          "url": "https://petsjanu.com",
          "logo": "https://petsjanu.com/logo.png",
          "contactPoint": { "@type": "ContactPoint", "telephone": "+91-6393741171", "contactType": "customer support", "email": "support@petsjanu.com", "areaServed": "IN", "availableLanguage": ["English", "Hindi"] }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What to do if my dog is lost in India?",
              "acceptedAnswer": { "@type": "Answer", "text": "Immediately activate Lost Mode on PetJanu (petsjanu.com) to trigger an emergency red SOS page, share the pet's public QR URL on local WhatsApp colony groups, and monitor real-time scanner sighting alerts." }
            },
            {
              "@type": "Question",
              "name": "How does a PetJanu QR smart tag work?",
              "acceptedAnswer": { "@type": "Answer", "text": "A PetJanu QR tag attaches to your pet's collar. Anyone who finds a lost pet can scan the code using any smartphone camera — without downloading an app — to view emergency contacts and send map sightings." }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
