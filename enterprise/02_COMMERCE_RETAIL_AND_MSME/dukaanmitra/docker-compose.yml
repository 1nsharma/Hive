version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://bazaarsync:bazaarsync_pass@db:5432/bazaarsync
      - JWT_SECRET=bazaarsync-self-hosted-secret-key-2026
      - DISABLE_HMR=true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: bazaarsync
      POSTGRES_PASSWORD: bazaarsync_pass
      POSTGRES_DB: bazaarsync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazaarsync -d bazaarsync"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
