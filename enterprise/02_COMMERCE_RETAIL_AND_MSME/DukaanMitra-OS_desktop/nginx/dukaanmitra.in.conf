# ==============================================================================
# Nginx Reverse Proxy Configuration for dukaanmitra.in & api.dukaanmitra.in
# DukaanMitra AI Technologies Private Limited
# ==============================================================================

# Upstream Service Definitions
upstream dukaanmitra_ai_web {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream dukaanmitra_core_engine {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP to HTTPS 301 Permanent Redirect
server {
    listen 80;
    listen [::]:80;
    server_name dukaanmitra.in www.dukaanmitra.in api.dukaanmitra.in;

    # ACME Challenge for Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main Web Portal & PWA (dukaanmitra.in & www.dukaanmitra.in)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dukaanmitra.in www.dukaanmitra.in;

    # SSL Certificates (managed via certbot --nginx -d dukaanmitra.in -d www.dukaanmitra.in)
    ssl_certificate /etc/letsencrypt/live/dukaanmitra.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dukaanmitra.in/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security & HSTS Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    client_max_body_size 16M;

    # PWA Service Worker (Never Cache sw.js)
    location = /static/sw.js {
        proxy_pass http://dukaanmitra_ai_web;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Meta WhatsApp Webhook Router (Proxied to Core Engine on :3000)
    location /webhook {
        proxy_pass http://dukaanmitra_core_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public Verification & All Web / AI APIs (Proxied to FastAPI on :8000)
    location / {
        proxy_pass http://dukaanmitra_ai_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# 3. API Subdomain (api.dukaanmitra.in)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.dukaanmitra.in;

    ssl_certificate /etc/letsencrypt/live/dukaanmitra.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dukaanmitra.in/privkey.pem;

    # WhatsApp Webhooks
    location /webhook {
        proxy_pass http://dukaanmitra_core_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Routes
    location / {
        proxy_pass http://dukaanmitra_ai_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
