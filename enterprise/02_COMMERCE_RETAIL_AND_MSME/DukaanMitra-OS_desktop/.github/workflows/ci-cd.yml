name: DukaanMitra-OS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Monorepo Test & Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Core Engine & Workspace Dependencies
        run: |
          npm ci
          npm --prefix apps/core-engine ci

      - name: Install Python AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-services/requirements.txt

      - name: Build TypeScript Core Engine
        run: |
          npm --prefix apps/core-engine run build

      - name: Run Unified Test Matrix (TypeScript & Python)
        run: |
          npm test

      - name: Validate Deployment Configurations
        run: |
          node scripts/validate-deployments.js

  docker-composition-check:
    name: Docker & Multi-Service Composition Check
    runs-on: ubuntu-latest
    needs: test-and-verify

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
          docker compose -f docker-compose.yml config

      - name: Build Unified Production Container
        run: |
          docker build -t dukaanmitra-os:latest .
