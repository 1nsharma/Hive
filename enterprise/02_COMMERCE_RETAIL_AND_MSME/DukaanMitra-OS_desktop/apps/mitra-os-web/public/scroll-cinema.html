<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Cinema – Universal 3D Story Engine</title>
    <style>
      body {
        margin: 0;
        overflow-x: hidden;
        background: #000;
        font-family: "Segoe UI", sans-serif;
      }
      /* Scroll container (16:9 film strip) */
      .scroll-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
      }
      .canvas-wrapper {
        position: relative;
        width: 100%;
        max-width: 1280px;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0, 150, 255, 0.4);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* 2D Narrative Overlay (per act) */
      .story-text {
        position: absolute;
        bottom: 10%;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        background: rgba(0, 0, 0, 0.7);
        padding: 1rem 2rem;
        border-radius: 1rem;
        text-align: center;
        backdrop-filter: blur(5px);
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .story-text h2 {
        font-size: 1.5rem;
        margin: 0;
      }
      .story-text p {
        margin: 0.3rem 0 0 0;
        opacity: 0.9;
      }

      /* Act progress indicator */
      .act-indicator {
        position: absolute;
        top: 5%;
        left: 5%;
        color: white;
        background: rgba(0, 0, 0, 0.6);
        padding: 0.3rem 0.8rem;
        border-radius: 20px;
        font-size: 0.85rem;
      }

      /* Fake scroll body (so user can scroll) */
      .scroll-space {
        position: relative;
        height: 400vh; /* 4 acts × 100vh */
        z-index: 0;
      }
    </style>
  </head>
  <body>
    <div class="scroll-container">
      <div class="canvas-wrapper" id="canvas-wrapper">
        <div class="act-indicator" id="act-label">Act 1: The Reality</div>
        <div class="story-text" id="story-text">
          <h2>The Daily Chaos</h2>
          <p>Long queues, pending khata, and endless manual work.</p>
        </div>
      </div>
    </div>
    <!-- Scrollable dummy space (height = number of acts * 100vh) -->
    <div class="scroll-space"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";

      // ----- Scene Setup -----
      const wrapper = document.getElementById("canvas-wrapper");
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        45,
        wrapper.clientWidth / wrapper.clientHeight,
        0.1,
        100,
      );
      camera.position.set(0, 2, 8);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
      });
      renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      wrapper.appendChild(renderer.domElement);

      // Lights
      const ambient = new THREE.AmbientLight(0x404066);
      scene.add(ambient);
      const dirLight = new THREE.DirectionalLight(0xffffff, 2);
      dirLight.position.set(5, 10, 7);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // ----- 3D Assets (primitive shapes for demo) -----
      // Act 1: Chaotic shop (dark/red)
      const chaosGroup = new THREE.Group();
      chaosGroup.position.set(0, 0, 4);
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(8, 8),
        new THREE.MeshStandardMaterial({ color: 0x3a2c2c, roughness: 0.8 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      chaosGroup.add(floor);
      // floating khata books
      for (let i = 0; i < 20; i++) {
        const book = new THREE.Mesh(
          new THREE.BoxGeometry(0.4, 0.6, 0.1),
          new THREE.MeshStandardMaterial({ color: 0x8b4513 }),
        );
        book.position.set(
          (Math.random() - 0.5) * 6,
          Math.random() * 3 + 0.5,
          (Math.random() - 0.5) * 6,
        );
        chaosGroup.add(book);
      }
      // red particle cloud (frustration)
      const chaosParticles = new THREE.BufferGeometry();
      const chaosPositions = new Float32Array(200 * 3);
      for (let i = 0; i < 200 * 3; i += 3) {
        chaosPositions[i] = (Math.random() - 0.5) * 7;
        chaosPositions[i + 1] = Math.random() * 4;
        chaosPositions[i + 2] = (Math.random() - 0.5) * 5;
      }
      chaosParticles.setAttribute(
        "position",
        new THREE.BufferAttribute(chaosPositions, 3),
      );
      const chaosParticleMat = new THREE.PointsMaterial({
        color: 0xff4444,
        size: 0.1,
        blending: THREE.AdditiveBlending,
      });
      const chaosCloud = new THREE.Points(chaosParticles, chaosParticleMat);
      chaosGroup.add(chaosCloud);
      scene.add(chaosGroup);

      // Act 2: Discovery (light beam)
      const discoveryGroup = new THREE.Group();
      discoveryGroup.position.set(0, 0, 0);
      const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.2, 8, 8),
        new THREE.MeshBasicMaterial({
          color: 0xffaa00,
          transparent: true,
          opacity: 0.6,
          blending: THREE.AdditiveBlending,
        }),
      );
      beam.position.set(0, 4, 0);
      discoveryGroup.add(beam);
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xffaa00 }),
      );
      discoveryGroup.add(core);
      discoveryGroup.visible = false;
      scene.add(discoveryGroup);

      // Act 3: Agent/Automation (glowing robot)
      const automationGroup = new THREE.Group();
      automationGroup.position.set(0, 0, -6);
      const robotBody = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 2, 1),
        new THREE.MeshStandardMaterial({ color: 0x00ccff, emissive: 0x004466 }),
      );
      robotBody.position.y = 1;
      automationGroup.add(robotBody);
      const robotHead = new THREE.Mesh(
        new THREE.SphereGeometry(0.7, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0x00ccff, emissive: 0x006688 }),
      );
      robotHead.position.y = 2.3;
      automationGroup.add(robotHead);
      // floating mini orbs
      for (let i = 0; i < 10; i++) {
        const orb = new THREE.Mesh(
          new THREE.SphereGeometry(0.15, 8, 8),
          new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: 0x00ffff,
          }),
        );
        orb.userData = { offset: Math.random() * Math.PI * 2 };
        automationGroup.add(orb);
      }
      automationGroup.visible = false;
      scene.add(automationGroup);

      // Act 4: Peace/Golden
      const peaceGroup = new THREE.Group();
      peaceGroup.position.set(0, 0, -12);
      const goldenLight = new THREE.PointLight(0xffd700, 2, 15);
      goldenLight.position.set(0, 3, 0);
      peaceGroup.add(goldenLight);
      const groundGlow = new THREE.Mesh(
        new THREE.PlaneGeometry(8, 8),
        new THREE.MeshStandardMaterial({
          color: 0x2a1f00,
          emissive: 0x332200,
          roughness: 0.5,
        }),
      );
      groundGlow.rotation.x = -Math.PI / 2;
      peaceGroup.add(groundGlow);
      peaceGroup.visible = false;
      scene.add(peaceGroup);

      // ----- Camera targets (act-wise) for "Zoom-In" Effect Z-axis only -----
      const actCameraTargets = [
        { pos: [0, 2, 8], look: [0, 2, 4] }, // Act 1
        { pos: [0, 2, 2], look: [0, 2, -2] }, // Act 2 (zooming in)
        { pos: [0, 2, -4], look: [0, 2, -8] }, // Act 3 (zooming further)
        { pos: [0, 2, -10], look: [0, 2, -14] }, // Act 4 (zooming deepest)
      ];

      // ----- UI elements -----
      const actLabel = document.getElementById("act-label");
      const storyText = document.getElementById("story-text");

      // ----- Scroll Logic -----
      let currentProgress = 0;
      const totalActs = 4; // we have 4 acts for demo
      
      let targetCameraPos = new THREE.Vector3(0, 2, 8);
      let targetCameraLook = new THREE.Vector3(0, 2, 4);

      function onScroll() {
        const scrollY = window.scrollY;
        const maxScroll = Math.max(1, document.body.scrollHeight - window.innerHeight);
        const progress = Math.min(scrollY / maxScroll, 1); // 0 to 1
        currentProgress = progress;

        // Determine current act (0-index)
        const actIndex = Math.floor(progress * totalActs);
        const actFraction =
          progress * totalActs - Math.floor(progress * totalActs); // 0-1 within act

        // Show/hide groups
        // Instead of toggling visibility, we keep them visible to allow zooming through the scene smoothly.
        chaosGroup.visible = true;
        discoveryGroup.visible = true;
        automationGroup.visible = true;
        peaceGroup.visible = true;

        // Update camera (lerp within act)
        const camTarget =
          actCameraTargets[Math.min(actIndex, actCameraTargets.length - 1)];
        const nextCamTarget =
          actCameraTargets[Math.min(actIndex + 1, actCameraTargets.length - 1)];

        // Fix: lerpFactor calculation was using Math.floor which is incorrect at integer boundaries like 1.0 but it's okay for continuous.
        // Wait, what if actIndex is out of bounds?
        const safeActIndex = Math.min(actIndex, actCameraTargets.length - 1);

        const lerpFactor = actFraction;
        
        targetCameraPos.set(
          camTarget.pos[0] + (nextCamTarget.pos[0] - camTarget.pos[0]) * lerpFactor,
          camTarget.pos[1] + (nextCamTarget.pos[1] - camTarget.pos[1]) * lerpFactor,
          camTarget.pos[2] + (nextCamTarget.pos[2] - camTarget.pos[2]) * lerpFactor
        );
        targetCameraLook.set(
          camTarget.look[0] + (nextCamTarget.look[0] - camTarget.look[0]) * lerpFactor,
          camTarget.look[1] + (nextCamTarget.look[1] - camTarget.look[1]) * lerpFactor,
          camTarget.look[2] + (nextCamTarget.look[2] - camTarget.look[2]) * lerpFactor
        );

        // Update UI
        const acts = [
          {
            title: "The Chaos",
            desc: "Long queues, pending khata, and endless manual work.",
          },
          {
            title: "The Discovery",
            desc: "A new AI energy appears — the answer to his prayers.",
          },
          {
            title: "The Automation",
            desc: "Munim arrives and transforms the shop instantly.",
          },
          { title: "The Peace", desc: "Work is complete. The future is here." },
        ];
        const safeUIIndex = Math.min(actIndex, acts.length - 1);
        actLabel.textContent = `Act ${safeUIIndex + 1}: ${acts[safeUIIndex].title}`;
        storyText.querySelector("h2").textContent = acts[safeUIIndex].title;
        storyText.querySelector("p").textContent = acts[safeUIIndex].desc;
      }

      window.addEventListener("scroll", onScroll);
      window.addEventListener("resize", () => {
        camera.aspect = wrapper.clientWidth / wrapper.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
      });

      // Animate loop
      function animate() {
        requestAnimationFrame(animate);
        
        // Let the camera smoothly glide towards the target calculated during scroll
        camera.position.lerp(targetCameraPos, 0.05);
        
        const currentLookAt = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).add(camera.position);
        currentLookAt.lerp(targetCameraLook, 0.05);
        camera.lookAt(currentLookAt);
        // subtle continuous animations
        if (chaosGroup.visible) {
          chaosCloud.rotation.y += 0.002;
        }
        if (automationGroup.visible) {
          automationGroup.children.forEach((child, i) => {
            if (
              child.geometry &&
              child.geometry.type === "SphereGeometry" &&
              child.userData.offset
            ) {
              child.position.x =
                Math.sin(Date.now() * 0.002 + child.userData.offset) * 1.5;
              child.position.y =
                1 + Math.cos(Date.now() * 0.002 + child.userData.offset) * 0.8;
              child.position.z =
                Math.cos(Date.now() * 0.001 + child.userData.offset) * 1.5;
            }
          });
        }
        renderer.render(scene, camera);
      }
      animate();

      // Initial trigger
      onScroll();
    </script>
  </body>
</html>
