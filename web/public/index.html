<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🐝 AI Hive Super Intelligence — Master Unified Command Center & Virtual Office</title>
  <link rel="stylesheet" href="office.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="office-app">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="brand">
        <div class="logo-box">🐝 HIVE OS</div>
        <div>
          <h1>AI HIVE SUPER INTELLIGENCE COMPANY</h1>
          <p class="subtitle">Unified Master Command Center • 17 Autonomous Agents • Desktop Orchestrator • 8 Enterprise Divisions</p>
        </div>
      </div>

      <div class="top-stats">
        <div class="stat-badge"><span class="dot green"></span> System: <strong>ALL MODULES UNIFIED</strong></div>
        <div class="stat-badge"><span class="dot blue"></span> Current Shift: <strong id="top-routine-label">09:00 AM Standup</strong></div>
        <div class="stat-badge"><span class="dot gold"></span> Orchestration: <strong>100% LOCAL & SECURE</strong></div>
      </div>

      <div class="top-actions">
        <button id="btn-advance-shift" class="btn btn-warning">⚡ Advance Routine</button>
        <button id="btn-call-standup" class="btn btn-primary">📢 Floor Standup</button>
        <button id="btn-refresh" class="btn btn-ghost">🔄 Refresh</button>
      </div>
    </header>

    <!-- Main Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="nav-btn active" data-tab="floor">🏢 Virtual Floor (17 Agents)</button>
      <button class="nav-btn" data-tab="workforce">👥 Workforce (FT & PT)</button>
      <button class="nav-btn" data-tab="schedule">⏱️ Shift Schedule</button>
      <button class="nav-btn" data-tab="director">🧠 Autonomous Director</button>
      <button class="nav-btn" data-tab="engines">⚡ Autonomous Engines</button>
      <button class="nav-btn" data-tab="orchestrator">🖥️ Desktop Orchestrator</button>
      <button class="nav-btn" data-tab="enterprise">🌐 Enterprise OS (8 Divisions)</button>
      <button class="nav-btn" data-tab="workspaces">📁 Workspaces (8)</button>
      <button class="nav-btn" data-tab="services">🚀 Microservices (8 Units)</button>
      <button class="nav-btn" data-tab="kanban">📋 Live Kanban</button>
      <button class="nav-btn" data-tab="cli">💻 Multi-Model CLI</button>
    </nav>

    <!-- App Viewport -->
    <main class="main-content" id="view-container">
      <!-- Dynamically filled by office.js -->
    </main>
  </div>

  <!-- Dispatch Modal -->
  <div id="dispatch-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-coworker-name">Dispatch Mission to Agent</h3>
        <button id="btn-close-modal" class="btn-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Target Workspace</label>
          <select id="modal-workspace-select" class="input"></select>
        </div>
        <div class="form-group">
          <label>Select AI Model Provider & Architecture</label>
          <select id="modal-model-select" class="input">
            <option value="antigravity|Gemini 3.1 Pro (High)">Antigravity: Gemini 3.1 Pro (High) — Ultra Reasoning</option>
            <option value="antigravity|Gemini 3.8 Flash (High)">Antigravity: Gemini 3.8 Flash (High) — Instant Speed</option>
            <option value="claude|claude-sonnet-4-6[1m]">Claude Code: Claude Sonnet (1M Context Window)</option>
            <option value="claude|claude-opus-5-5">Claude Code: Claude Opus 5.5 (Deep Synthesis)</option>
            <option value="openai|gpt-5-omni">OpenAI: GPT-5 Omni Multi-Modal</option>
            <option value="ollama|llama3-70b">Ollama / Local: Llama-3 70B Quantized</option>
          </select>
        </div>
        <div class="form-group">
          <label>Mission Prompt / Directive</label>
          <textarea id="modal-prompt-input" class="textarea" rows="4" placeholder="Enter instructions for the agent..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-cancel-modal" class="btn btn-ghost">Cancel</button>
        <button id="btn-confirm-dispatch" class="btn btn-primary">🚀 Dispatch Mission</button>
      </div>
    </div>
  </div>

  <script src="office.js"></script>
</body>
</html>
