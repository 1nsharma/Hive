<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🏢 AI Super Intelligence Company — Munder Difflin Virtual Office</title>
  <link rel="stylesheet" href="office.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="office-app">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="brand">
        <div class="logo-box">🏢 MD</div>
        <div>
          <h1>AI SUPER INTELLIGENCE COMPANY</h1>
          <p class="subtitle">Autonomous Floor • FT & PT AI Workforce • Self-Scheduling Duty Roster • Multi-Model CLI</p>
        </div>
      </div>

      <div class="top-stats">
        <div class="stat-badge"><span class="dot green"></span> Floor: <strong>AUTONOMOUS</strong></div>
        <div class="stat-badge"><span class="dot blue"></span> Current Shift: <strong id="top-routine-label">09:00 AM Standup</strong></div>
        <div class="stat-badge"><span class="dot gold"></span> Cost: <strong>100% FREE / LOCAL</strong></div>
      </div>

      <div class="top-actions">
        <button id="btn-advance-shift" class="btn btn-warning">⏰ Advance Routine</button>
        <button id="btn-call-standup" class="btn btn-primary">📢 Floor Standup</button>
        <button id="btn-refresh" class="btn btn-ghost">↻ Refresh</button>
      </div>
    </header>

    <!-- Main Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="nav-btn active" data-tab="floor">🗺️ Virtual Office Floor</button>
      <button class="nav-btn" data-tab="workforce">👥 Full-Time & Part-Time Workforce</button>
      <button class="nav-btn" data-tab="schedule">⏰ Shift Engine & Schedule (Kab Kya Karna)</button>
      <button class="nav-btn" data-tab="director">🤖 Autonomous Director (Kudh Kya Karna)</button>
      <button class="nav-btn" data-tab="workspaces">📂 Department Workspaces (8)</button>
      <button class="nav-btn" data-tab="services">🏢 Enterprise Services (8 Business Units)</button>
      <button class="nav-btn" data-tab="kanban">📋 Live Task Board</button>
      <button class="nav-btn" data-tab="cli">💻 Multi-Model CLI Terminal</button>
    </nav>

    <!-- App Viewport -->
    <main class="main-content" id="view-container">
      <!-- Dynamically filled by office.js -->
    </main>
  </div>

  <!-- Dispatch Modal -->
  <div id="dispatch-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-coworker-name">Dispatch Mission to Coworker</h3>
        <button id="btn-close-modal" class="btn-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Target Workspace</label>
          <select id="modal-workspace-select" class="input"></select>
        </div>
        <div class="form-group">
          <label>Select AI Model Provider & Architecture</label>
          <select id="modal-model-select" class="input">
            <option value="antigravity|Gemini 3.1 Pro (High)">Antigravity: Gemini 3.1 Pro (High) — Ultra Reasoning</option>
            <option value="antigravity|Gemini 3.8 Flash (High)">Antigravity: Gemini 3.8 Flash (High) — Instant Speed</option>
            <option value="claude|claude-sonnet-4-6[1m]">Claude Code: Claude Sonnet (1M Context Window)</option>
            <option value="claude|claude-opus-5-5">Claude Code: Claude Opus 5.5 (Deep Synthesis)</option>
            <option value="cursor|composer-2.5">Cursor: Composer 2.5 (Multi-File Agent)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Mission Directive / Prompt</label>
          <textarea id="modal-prompt" class="textarea" rows="4" placeholder="Enter high-level goal or instruction..."></textarea>
        </div>
        <button id="btn-submit-dispatch" class="btn btn-primary" style="width:100%;">🚀 Launch Autonomous Mission via CLI</button>
      </div>
    </div>
  </div>

  <script src="office.js"></script>
</body>
</html>
